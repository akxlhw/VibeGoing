[project]
name = "vibegoing"
version = "0.1.0"
description = "Local-first AI teammates on CrewAI: persistent Souls, long-term memory, BYO key."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15.20,<2",
    "python-dotenv>=1.2.2,<2",
]

[project.scripts]
vibegoing = "vibegoing.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
